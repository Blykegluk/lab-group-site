    <script>
      // Pose le thème avant le premier rendu, pour éviter un flash clair en mode sombre.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('lab-theme') } catch (e) {}
        if (theme !== 'clair' && theme !== 'sombre') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
